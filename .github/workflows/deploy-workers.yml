# main に入ったら、サイトを組み立てて本番の Worker（dp-guild-site）に出す。
# Cloudflare の画面からの GitHub 連携がつながらなかったため、GitHub の側から出す（2026-11-18。marutto と同じ形）。
# 鍵は GitHub の secrets、アカウントの番号は variables に置き、リポジトリには書かない
name: Deploy Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

# 続けて入った時は、前の出しを待ってから順に出す（途中で切らない）
concurrency:
  group: deploy-workers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: 値が揃っているかを見る
        env:
          A: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          for n in A T; do [ -n "${!n}" ] || { echo "$n が空です"; exit 1; }; done
      - run: npm ci
      # microCMS の本物の値は Worker 側に入っている。組み立てでは仮の値でよい（ブログは開いた時に読む作り）
      # build:workers は、組み立ての前後に手元の .env の値が入っていないかを見る
      - run: npm run build:workers
        env:
          MICROCMS_SERVICE_DOMAIN: dummy
          MICROCMS_API_KEY: dummy
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
